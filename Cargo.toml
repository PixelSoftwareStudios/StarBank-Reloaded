[workspace]
members = [
    "apps/starbank-cli",
    "apps/starbank-desktop/src-tauri",
    "crates/adapters/starbank-mpq",
    "crates/adapters/starbank-mpq/fuzz",
    "crates/adapters/starbank-mpq-stormlib",
    "crates/bindings/starbank-wasm",
    "crates/discovery/starbank-map-index",
    "crates/discovery/starbank-paths",
    "crates/domain/starbank-backup",
    "crates/domain/starbank-editor",
    "crates/domain/starbank-profiles",
    "crates/domain/starbank-signature",
    "crates/engineering/starbank-source-check",
    "crates/engineering/starbank-testkit",
    "crates/formats/sc2bank",
    "crates/formats/sc2bank/fuzz",
    "crates/foundation/starbank-core",
    "crates/platform/starbank-fs",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100.0"
publish = false

[workspace.dependencies]
starbank-core = { path = "crates/foundation/starbank-core" }
starbank-editor = { path = "crates/domain/starbank-editor" }

# Command-line input and UTC timestamps
clap = { version = "=4.6.8", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
time = "=0.3.55"

# Portable bindings
wasm-bindgen = "=0.2.129"

# Versioned command and settings models
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

# Bank XML
quick-xml = { version = "=0.42.0", default-features = false }
roxmltree = "=0.21.2"

# Legacy bank signatures
hex = { version = "=0.4.3", default-features = false, features = ["alloc"] }
sha1 = { version = "=0.11.0", default-features = false }

# File and backup integrity
sha2 = { version = "=0.11.1", default-features = false }

# Local map metadata
flate2 = { version = "=1.1.11", default-features = false, features = ["rust_backend"] }
stormlib-rs = { version = "=0.0.3", default-features = false }

# Deterministic verification fixtures and timing
starbank-testkit = { path = "crates/engineering/starbank-testkit" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
