[package]
name = "starbank-map-index"
description = "Local StarCraft II cache metadata and bank association"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
cap-std = "=4.0.3"
serde.workspace = true
serde_json.workspace = true
starbank-mpq = { path = "../../adapters/starbank-mpq" }
starbank-paths = { path = "../starbank-paths" }
tempfile = "=3.27.0"

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.6", features = ["fs"] }

[dev-dependencies]
starbank-testkit.workspace = true

[[bench]]
name = "workloads"
harness = false

[lints]
workspace = true
