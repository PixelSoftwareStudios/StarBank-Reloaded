[package]
name = "starbank-paths"
description = "Native StarCraft II data-root discovery and scoped bank inventory"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
cap-std = "=4.0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
	"Win32_Foundation",
	"Win32_Globalization",
	"Win32_Storage_FileSystem",
	"Win32_System_Com",
	"Win32_UI_Shell",
] }

[dev-dependencies]
tempfile = "=3.27.0"

[lints]
workspace = true
