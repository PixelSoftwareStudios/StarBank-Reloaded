[package]
name = "starbank-format-fuzz"
description = "Opt-in bounded verification for the SC2 bank parser and writer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[package.metadata]
cargo-fuzz = true

[features]
fuzzing = ["dep:libfuzzer-sys"]

[dependencies]
libfuzzer-sys = { version = "=0.4.13", optional = true }
sc2bank = { path = ".." }

[[bin]]
name = "lossless"
path = "fuzz_targets/lossless.rs"
required-features = ["fuzzing"]
test = false
doc = false
bench = false

[[bin]]
name = "structural"
path = "fuzz_targets/structural.rs"
required-features = ["fuzzing"]
test = false
doc = false
bench = false

[lints]
workspace = true
