[package]
name = "starbank-instance"
description = "Bounded native launch delivery between local editor instances"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[target.'cfg(windows)'.dependencies]
tokio = { version = "=1.54.1", features = ["io-util", "net", "rt", "time"] }
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true, features = ["Wdk_Foundation", "Win32_System_WindowsProgramming"] }

[lints]
workspace = true
