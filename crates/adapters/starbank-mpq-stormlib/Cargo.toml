[package]
name = "starbank-mpq-stormlib"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
links = "starbank_stormlib"

[features]
default = []
native-stormlib = ["dep:libc", "dep:rustix", "dep:sha2", "dep:starbank-mpq", "dep:tempfile"]

[dependencies]
starbank-mpq = { path = "../starbank-mpq", optional = true }

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
libc = { version = "=0.2.191", optional = true }
rustix = { version = "=1.1.6", features = ["fs"], optional = true }
tempfile = { version = "=3.27.0", optional = true }

[build-dependencies]
sha2 = { workspace = true, optional = true }

[lints]
workspace = true
