[package]
name = "starbank-mpq-fuzz"
description = "Opt-in fuzz verification for the classic MPQ V1 append verifier"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[package.metadata]
cargo-fuzz = true

[features]
fuzzing = ["dep:libfuzzer-sys"]

[dependencies]
libfuzzer-sys = { version = "=0.4.13", optional = true }
starbank-mpq = { path = ".." }
stormlib-rs.workspace = true

[[bin]]
name = "v1_append"
path = "fuzz_targets/v1_append.rs"
required-features = ["fuzzing"]
test = false
doc = false
bench = false

[lints]
workspace = true
