name: Workspace CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Source checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show
      - run: cargo fmt --all -- --check
      - name: Check GTK ownership fixture formatting
        run: rustfmt --check --edition 2021 crates/vendor/verification/rfd/ownership.rs
      - run: python3 docs/verification/scripts/validate.py
      - run: python3 -B apps/starbank-desktop/verification/test_verify_package.py
      - name: Verify the pinned GLib security backport
        run: |
          python3 crates/vendor/verification/glib/check.py
          python3 crates/vendor/verification/glib/test_check.py
      - run: cargo run --locked -p starbank-source-check
      - name: Verify the pinned GTK ownership backports
        run: |
          python3 -B crates/vendor/verification/rfd/check.py
          python3 -B crates/vendor/verification/rfd/test_check.py
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-audit@0.22.2
          fallback: none
      - name: Audit locked Rust dependencies
        run: cargo audit --deny unsound

  native:
    name: Rust native on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-nextest@0.9.152
      # The desktop matrix supplies native WebView prerequisites and tests the app.
      - run: cargo check --workspace --exclude starbank-desktop --all-targets --locked
      - run: cargo clippy --workspace --exclude starbank-desktop --all-targets --locked -- -D warnings
      - run: cargo nextest run --workspace --exclude starbank-desktop --locked --no-tests fail
      - name: Exercise Linux staging space exhaustion
        if: runner.os == 'Linux'
        shell: bash
        run: |
          fixture="$(mktemp -d "$RUNNER_TEMP/starbank-enospc.XXXXXX")"
          cleanup() {
            if mountpoint -q "$fixture"; then
              sudo umount "$fixture"
            fi
            rmdir "$fixture"
          }
          trap cleanup EXIT
          sudo mount -t tmpfs \
            -o "size=64k,mode=0700,uid=$(id -u),gid=$(id -g),nodev,nosuid,noexec" \
            tmpfs "$fixture"
          STARBANK_ENOSPC_TMPFS="$fixture" cargo nextest run -p starbank-fs --locked \
            --run-ignored only --no-tests fail --success-output immediate \
            -E 'package(=starbank-fs) & binary(=linux_enospc)'
      - name: Exercise APFS staging space exhaustion
        if: runner.os == 'macOS'
        run: sh crates/platform/starbank-fs/verification/macos-enospc.sh
      - name: Probe exclusive handle-relative NTFS publication
        if: runner.os == 'Windows'
        run: >-
          cargo nextest run --locked -p starbank-fs --lib
          --run-ignored only --no-tests fail --success-output immediate
          -E 'test(=windows::rename_qualification::local_ntfs_handle_relative_create_only_publication)'
      - name: Qualify the Windows create-only transaction candidate
        if: runner.os == 'Windows'
        run: >-
          cargo nextest run --locked -p starbank-fs --lib
          --run-ignored only --no-tests fail --success-output immediate
          -E 'test(=windows::create::tests::local_ntfs_create_candidate_transactions)'
      - name: Exercise NTFS staging space exhaustion
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 3
        run: '& ./crates/platform/starbank-fs/verification/windows-enospc.ps1'
      - name: Qualify held-file NTFS stream enumeration
        if: runner.os == 'Windows'
        timeout-minutes: 2
        run: >-
          cargo nextest run --locked -p starbank-fs --lib
          --run-ignored only --no-tests fail --success-output immediate
          -E 'test(=windows::stream_qualification::local_ntfs_held_file_stream_inventory)'
      - name: Qualify Windows single-instance launch delivery
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $selection = @('--locked', '-p', 'starbank-instance', '--lib', '--run-ignored', 'only',
            '-E', 'test(/^windows::tests::qualify_/)')
          $listingJson = cargo nextest list @selection --message-format json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $listing = $listingJson | ConvertFrom-Json -AsHashtable
          $selected = @($listing['rust-suites'].Values |
            ForEach-Object { $_['testcases'].Values } |
            Where-Object { $_.ignored -and $_['filter-match'].status -eq 'matches' })
          if ($selected.Count -ne 5) {
            throw "Expected five ignored Windows qualification tests, found $($selected.Count)."
          }
          cargo nextest run @selection --no-tests fail --test-threads 1 --success-output immediate
      - name: Verify the pinned native StormLib append backend
        if: matrix.os == 'macos-15'
        shell: bash
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
        run: |
          work="$(mktemp -d "$RUNNER_TEMP/starbank-stormlib-ci.XXXXXX")"
          trap 'rm -rf -- "$work"' EXIT
          cmake_asset=cmake-4.4.4-macos-universal.tar.gz
          cmake_sha256=4b7b73704b1db9b374e5c9ab8e17ac6148b817b6396ee75cd94a852cbac9d305
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --retry 3 \
            --output "$work/$cmake_asset" \
            "https://github.com/Kitware/CMake/releases/download/v4.4.4/$cmake_asset"
          printf '%s  %s\n' "$cmake_sha256" "$work/$cmake_asset" | shasum -a 256 --check
          tar -xzf "$work/$cmake_asset" -C "$work"
          cmake_bin="$(find "$work" -type f -path '*/bin/cmake' -print)"
          test -x "$cmake_bin"
          export PATH="${cmake_bin%/*}:$PATH"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --retry 3 \
            --output "$work/StormLib-v9.40.tar.gz" \
            https://codeload.github.com/ladislav-zezula/StormLib/tar.gz/refs/tags/v9.40
          STARBANK_STORMLIB_ARTIFACT="$(
            sh crates/adapters/starbank-mpq-stormlib/verification/bootstrap-macos-arm64.sh \
              "$work/StormLib-v9.40.tar.gz"
          )"
          export STARBANK_STORMLIB_ARTIFACT
          cargo clippy --locked -p starbank-mpq-stormlib --features native-stormlib --all-targets -- -D warnings
          cargo nextest run --locked -p starbank-mpq-stormlib --features native-stormlib --no-tests fail
      - name: Run bounded MPQ append verifier fuzzing under AddressSanitizer
        if: matrix.os == 'macos-15'
        id: mpq_fuzz
        shell: bash
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
        run: |
          work="$(mktemp -d "$RUNNER_TEMP/starbank-mpq-fuzz.XXXXXX")"
          printf 'evidence=%s\n' "$work" >> "$GITHUB_OUTPUT"
          (
            set -e
            fuzz_toolchain=nightly-2026-11-04
            rustup toolchain install "$fuzz_toolchain" --profile minimal
            cargo +1.100.0 install cargo-fuzz --version '=0.13.2' --locked
            test "$(cargo "+$fuzz_toolchain" fuzz --version)" = 'cargo-fuzz 0.13.2'
            cargo "+$fuzz_toolchain" metadata --locked --format-version 1 > /dev/null
            mkdir "$work/corpus" "$work/artifacts"
            cp Cargo.lock "$work/Cargo.lock"
            cp crates/adapters/starbank-mpq/tests/fixtures/append-v1-{source,output}.s2ma "$work/corpus/"
            for selector in 000 001 002 003 004 005 006 007; do
              printf '%b' "\\$selector\\000\\001\\002" > "$work/corpus/operation-$selector"
            done
            printf '\006\001x' > "$work/corpus/traversal-name"
            printf '\006\002Edited.txt' > "$work/corpus/arbitrary-name"
            cargo "+$fuzz_toolchain" fuzz run \
              --fuzz-dir crates/adapters/starbank-mpq/fuzz --features fuzzing \
              --target-dir target/starbank-mpq-fuzz --sanitizer address v1_append "$work/corpus" -- \
              -seed=1 -max_len=4096 -len_control=0 -max_total_time=20 -rss_limit_mb=1024 \
              -timeout=5 -print_funcs=0 -print_final_stats=1 "-artifact_prefix=$work/artifacts/"
            cmp Cargo.lock "$work/Cargo.lock"
          ) 2>&1 | tee "$work/run.log"
          rm -rf -- "$work"
      - name: Retain failed MPQ fuzz evidence
        if: failure() && steps.mpq_fuzz.outcome == 'failure' && steps.mpq_fuzz.outputs.evidence != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mpq-append-fuzz-failure
          path: |
            ${{ steps.mpq_fuzz.outputs.evidence }}/run.log
            ${{ steps.mpq_fuzz.outputs.evidence }}/corpus/
            ${{ steps.mpq_fuzz.outputs.evidence }}/artifacts/
          if-no-files-found: error
          retention-days: 7
      - run: cargo test --workspace --exclude starbank-desktop --doc --locked
      - run: cargo doc --workspace --exclude starbank-desktop --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  wasm:
    name: Pure Rust on wasm32
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show
      # Keep the package lists explicit when adding portable crates.
      - run: >-
          cargo build --locked --target wasm32-unknown-unknown
          -p starbank-core -p sc2bank -p starbank-signature
          -p starbank-profiles -p starbank-editor -p starbank-wasm
      - run: >-
          cargo clippy --locked --target wasm32-unknown-unknown
          -p starbank-core -p sc2bank -p starbank-signature
          -p starbank-profiles -p starbank-editor -p starbank-wasm
          -- -D warnings

  frontend:
    name: Web build and browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - run: rustup show
      - name: Install the matching wasm-bindgen CLI
        shell: bash
        run: |
          bindgen_version=0.2.129
          bindgen_archive="wasm-bindgen-${bindgen_version}-x86_64-unknown-linux-musl.tar.gz"
          bindgen_sha256=82d12bb940e2d4e72e0d5605387fc1b8ca179044e012b620f0ce4e7440e8320e
          bindgen_dir="$(mktemp -d "$RUNNER_TEMP/starbank-bindgen.XXXXXX")"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --retry 3 \
            --output "$bindgen_dir/$bindgen_archive" \
            "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/$bindgen_version/$bindgen_archive"
          printf '%s  %s\n' "$bindgen_sha256" "$bindgen_dir/$bindgen_archive" | sha256sum --check
          tar -xzf "$bindgen_dir/$bindgen_archive" -C "$bindgen_dir" --strip-components=1 \
            "${bindgen_archive%.tar.gz}/wasm-bindgen"
          test "$("$bindgen_dir/wasm-bindgen" --version)" = "wasm-bindgen $bindgen_version"
          printf '%s\n' "$bindgen_dir" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - name: Audit locked frontend dependencies
        run: pnpm audit
      # Building generates the release WASM bindings used by the web app and adapter parity.
      - run: pnpm build
      - run: pnpm check
      - run: pnpm test
      - name: Build the native adapter parity fixtures
        run: |
          cargo build --locked --target-dir target -p starbank-cli --bin starbank
          cargo build --locked --target-dir target -p starbank-editor --example parity_protocol
      - name: Compare native, release WASM and CLI bank output
        run: node apps/starbank-web/test/adapter-parity.mjs
      - name: Install pinned Playwright browsers and dependencies
        run: pnpm --filter starbank-web exec playwright install --with-deps chromium firefox webkit
      - name: Test the production desktop renderer with synthetic IPC
        env:
          TAURI_ENV_PLATFORM: windows
        run: |
          pnpm --filter starbank-desktop run build:webview
          pnpm --filter starbank-web test:desktop-renderer
      - name: Test the production web app offline
        run: pnpm --filter starbank-web test:browser
      - name: Test the breadcrumb layout and keyboard navigation
        run: pnpm --filter starbank-web exec node test/breadcrumbs.mjs chromium firefox webkit

  desktop:
    name: Native desktop on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Install Linux WebView dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libgtk-3-dev libwebkit2gtk-4.1-dev libxdo-dev libx11-dev \
            webkit2gtk-driver xvfb xdotool
      - run: rustup show
      - run: pnpm install --frozen-lockfile
      - name: Build the unsigned macOS app bundle
        if: runner.os == 'macOS'
        run: pnpm --filter starbank-desktop exec tauri build --bundles app --no-sign --debug -- --locked
      - name: Build the unsigned Debian package
        if: runner.os == 'Linux'
        run: pnpm --filter starbank-desktop exec tauri build --bundles deb --no-sign --debug -- --locked
      - name: Verify macOS and Debian package payloads
        if: runner.os != 'Windows'
        run: >-
          python3 apps/starbank-desktop/verification/verify_package.py
          target/debug/bundle "${{ runner.os }}" "${{ runner.arch }}"
      - name: Test GTK allocation ownership without a display
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: python3 -B crates/vendor/verification/rfd/run_ownership.py
      - name: Install the verified Debian package
        id: install_deb
        if: runner.os == 'Linux'
        run: |
          if dpkg-query -W starbank-reloaded >/dev/null 2>&1; then
            echo 'The test package must not already have a package record.' >&2
            exit 1
          fi
          deb_version=$(node -p 'require("./apps/starbank-desktop/src-tauri/tauri.conf.json").version')
          deb_arch=$(dpkg --print-architecture)
          echo 'purge_owned=true' >> "$GITHUB_OUTPUT"
          sudo dpkg --install "target/debug/bundle/deb/starbank-reloaded_${deb_version}_${deb_arch}.deb"
          test "$(dpkg-query -W -f='${Status} ${Version} ${Architecture}' starbank-reloaded)" \
            = "install ok installed $deb_version $deb_arch"
          test -x /usr/bin/starbank-desktop
          test "$(dpkg-query -S /usr/share/applications/starbank-reloaded.desktop)" \
            = 'starbank-reloaded: /usr/share/applications/starbank-reloaded.desktop'
      - name: Install the pinned Linux WebView test driver
        if: runner.os == 'Linux'
        run: |
          cargo install tauri-driver --version '=2.0.6' --locked --root "$RUNNER_TEMP/starbank-webdriver"
          echo "$RUNNER_TEMP/starbank-webdriver/bin" >> "$GITHUB_PATH"
      - name: Exercise the real Linux WebView headlessly
        if: runner.os == 'Linux'
        timeout-minutes: 3
        run: |
          cc -std=c11 -Wall -Wextra -Wpedantic -Werror \
            apps/starbank-desktop/verification/linux-close-window.c \
            -o "$RUNNER_TEMP/starbank-close-window" -lX11
          cc -std=c11 -Wall -Wextra -Wpedantic -Werror \
            apps/starbank-desktop/verification/linux-clipboard-read.c \
            -o "$RUNNER_TEMP/starbank-clipboard-read" -lX11
          xvfb-run -a --server-args='-screen 0 1280x900x24' \
            node apps/starbank-desktop/verification/linux-native-webview.mjs \
            /usr/bin/starbank-desktop "$RUNNER_TEMP/starbank-close-window" \
            "$RUNNER_TEMP/starbank-clipboard-read"
      - name: Build the unsigned NSIS installer
        if: runner.os == 'Windows'
        run: pnpm --filter starbank-desktop exec tauri build --bundles nsis --no-sign --debug -- --locked
      - name: Verify silent NSIS install and uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 5
        run: ./apps/starbank-desktop/verification/windows-nsis.ps1
      - name: Test the packaged desktop navigation policy
        run: >-
          cargo test --locked -p starbank-desktop --features custom-protocol --bin starbank-desktop
          desktop::tests::distinguishes_interactive_webview_origins -- --exact
      - run: cargo clippy --locked -p starbank-desktop --no-default-features --features desktop --all-targets -- -D warnings
      - run: cargo test --locked -p starbank-desktop --no-default-features --features desktop
      - name: Remove the installed test package
        if: always() && runner.os == 'Linux' && steps.install_deb.outputs.purge_owned == 'true'
        run: |
          if dpkg-query -W starbank-reloaded >/dev/null 2>&1; then
            sudo dpkg --purge starbank-reloaded
          fi
          test ! -e /usr/bin/starbank-desktop
          test ! -e /usr/share/applications/starbank-reloaded.desktop
