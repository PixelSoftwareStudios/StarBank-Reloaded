[package]
name = "starbank-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "starbank-desktop"
path = "src/main.rs"
required-features = ["desktop"]

[features]
desktop = ["dep:libc", "dep:rfd", "dep:sc2bank", "dep:serde", "dep:serde_json", "dep:starbank-editor", "dep:starbank-fs", "dep:tauri", "dep:tauri-build", "dep:windows-sys"]
custom-protocol = ["desktop", "tauri/custom-protocol"]

[dependencies]
sc2bank = { path = "../../../crates/formats/sc2bank", optional = true }
rfd = { version = "=0.17.2", default-features = false, features = ["gtk3"], optional = true }
starbank-fs = { path = "../../../crates/platform/starbank-fs", optional = true }
starbank-editor = { path = "../../../crates/domain/starbank-editor", optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tauri = { version = "=2.12.7", default-features = false, features = ["wry", "compression", "common-controls-v6", "x11"], optional = true }

[target.'cfg(unix)'.dependencies]
libc = { version = "=0.2.191", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Storage_FileSystem"], optional = true }

[build-dependencies]
tauri-build = { version = "=2.7.6", optional = true }

[dev-dependencies]
tempfile = "=3.27.0"

[lints]
workspace = true
