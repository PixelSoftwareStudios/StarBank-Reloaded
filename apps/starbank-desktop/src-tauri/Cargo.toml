[package]
name = "starbank-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "starbank-desktop"
path = "src/main.rs"
required-features = ["desktop"]

[features]
desktop = [
  "dep:libc",
  "dep:rfd",
  "dep:sc2bank",
  "dep:serde",
  "dep:serde_json",
  "dep:starbank-backup",
  "dep:starbank-core",
  "dep:starbank-editor",
  "dep:starbank-fs",
  "dep:starbank-instance",
  "dep:starbank-map-index",
  "dep:starbank-paths",
  "dep:starbank-signature",
  "dep:tauri",
  "dep:tauri-build",
  "dep:tempfile",
  "dep:windows-sys",
]
custom-protocol = ["desktop", "tauri/custom-protocol"]

[dependencies]
sc2bank = { path = "../../../crates/formats/sc2bank", optional = true }
rfd = { version = "=0.17.2", default-features = false, features = ["gtk3"], optional = true }
starbank-fs = { path = "../../../crates/platform/starbank-fs", optional = true }
starbank-editor = { path = "../../../crates/domain/starbank-editor", optional = true }
starbank-backup = { path = "../../../crates/domain/starbank-backup", optional = true }
starbank-core = { workspace = true, optional = true }
starbank-map-index = { path = "../../../crates/discovery/starbank-map-index", optional = true }
starbank-paths = { path = "../../../crates/discovery/starbank-paths", optional = true }
starbank-signature = { path = "../../../crates/domain/starbank-signature", optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tauri = { version = "=2.12.7", default-features = false, features = ["wry", "compression", "common-controls-v6", "x11"], optional = true }
tempfile = { version = "=3.27.0", optional = true }

[target.'cfg(unix)'.dependencies]
libc = { version = "=0.2.191", optional = true }

[target.'cfg(windows)'.dependencies]
starbank-instance = { path = "../../../crates/platform/starbank-instance", optional = true }
windows-sys = { workspace = true, features = ["Win32_Storage_FileSystem"], optional = true }

[build-dependencies]
tauri-build = { version = "=2.7.6", optional = true , features = [] }

[dev-dependencies]
tempfile = "=3.27.0"

[target.'cfg(windows)'.dev-dependencies]
tauri = { version = "=2.12.7", default-features = false, features = ["test"] }

[lints]
workspace = true
